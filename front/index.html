<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lofi-Library | Biblioteca Virtual</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./dist/css/style.css">
    <link rel="stylesheet" href="./dist/css/mobile.css">
</head>
<body>

    <!-- ========== HEADER ========== -->
    <header class="encabezado">
        <nav class="navbar navbar-expand-md">
            <div class="container">
                <a class="navbar-brand logo" href="index.html">LOFI-LIBRERY</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#menu" aria-controls="menu" aria-expanded="false"
                        aria-label="Mostrar menú">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-end" id="menu">
                    <div class="navbar-nav gap-2">
                        <a class="btn btn-nav" href="#inicio">Inicio</a>
                        <a class="btn btn-nav" href="#catalogo">Catalogo</a>
                        <a class="btn btn-nav" href="dist/pages/login.html" id="btnLogin">Iniciar Sesión</a>
                        <a class="btn btn-nav" href="#" id="btnSalir" hidden>Cerrar sesión</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <!-- ========== BANNER ========== -->
        <section id="inicio" class="banner d-flex align-items-center">
            <div class="container">
                <h1 class="banner-texto">
                    Con la compra de tus libros obtienes un 40% de descuento
                    desde la web con envío incluido
                </h1>
            </div>
        </section>

        <!-- ========== CATALOGO ========== -->
        <section id="catalogo" class="catalogo py-5">
            <div class="container">
                <h2 class="text-center text-white mb-4">Catálogo</h2>

                <!-- Las tarjetas las genera js/main.js a partir de GET /api/libros -->
                <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-4 justify-content-center" id="listaLibros" aria-live="polite">
                    <p class="text-center text-white w-100" id="mensajeCatalogo">Cargando catálogo...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- ========== FOOTER ========== -->
    <footer class="pie py-4">
        <div class="container">
            <p>Contacto: 2408 5555</p>
            <p>lofilibrary@lofy.com</p>
            <p class="mb-0">Dir.: Shopping Costa Urbana primera planta</p>
        </div>
    </footer>


    <!-- ========== DETALLE DEL LIBRO ("Ver más") ========== -->
    <div class="modal fade" id="modalLibro" tabindex="-1" aria-labelledby="modalLibroTitulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content modal-libro">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalLibroTitulo"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-4">
                        <div class="col-5 col-md-4">
                            <img id="modalLibroImg" class="img-fluid rounded shadow" alt="">
                        </div>
                        <div class="col-7 col-md-8">
                            <p class="fw-bold mb-1" id="modalLibroAutor"></p>
                            <p class="mb-3"><span class="badge badge-categoria" id="modalLibroCategoria"></span></p>
                            <p id="modalLibroDescripcion"></p>
                            <p class="precio-libro mb-2" id="modalLibroPrecio"></p>
                            <span class="badge" id="modalLibroEstado"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="./dist/js/api.js"></script>
    <script src="./dist/js/utils.js"></script>
    <script src="./dist/js/script.js"></script>
</body>
</html>
