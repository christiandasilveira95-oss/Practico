<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Lofi-Library</title>

    <!-- Bootstrap 5 (se usa solo para los avisos) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tipografía del título (si no carga, se usa una alternativa del sistema) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- CSS de esta pantalla -->
    <link rel="stylesheet" href="../css/login.css">
</head>
<body class="auth-pagina">

    <main class="auth-tarjeta">

        <!-- ===== Mitad izquierda: imagen ===== -->
        <section class="auth-imagen">
            <img src="../../assets/img/lofi-biblioteca.jpg" width="1497" height="482"
                 alt="Una biblioteca antigua de noche con lluvia en las ventanas: una chica con auriculares escribe junto a una lámpara y un gato duerme sobre los libros">
            <p class="auth-bienvenida">BIENVENIDO</p>
        </section>

        <!-- ===== Mitad derecha: formulario ===== -->
        <section class="auth-form">
            <a class="auth-volver" href="../../index.html">&larr; Volver al catálogo</a>

            <div class="auth-form-centro">
                <h1 class="auth-titulo">Iniciar sesión</h1>

                <!-- Mensajes: info (viene de una redirección) y error (falló el login) -->
                <div class="alert alert-info py-2" id="avisoInfo" role="status" hidden></div>
                <div class="alert alert-danger py-2" id="avisoError" role="alert" hidden></div>

                <form id="formLogin" novalidate>
                    <div class="auth-campo">
                        <input type="email" id="email" name="email" placeholder=" "
                               autocomplete="username" required autofocus>
                        <label for="email">Email</label>
                    </div>

                    <div class="auth-campo auth-campo-password">
                        <input type="password" id="password" name="password" placeholder=" "
                               autocomplete="current-password" required>
                        <label for="password">Contraseña</label>
                        <a class="auth-olvido" href="mailto:lofilibrary@lofy.com?subject=Recuperar%20mi%20contrase%C3%B1a">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="auth-boton" id="btnEntrar">Ingresar</button>
                </form>
            </div>

            <p class="auth-pie">¿No tenés cuenta? <a href="mailto:lofilibrary@lofy.com?subject=Quiero%20crear%20una%20cuenta">Contactanos</a></p>
        </section>

    </main>

    <script src="../js/api.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
