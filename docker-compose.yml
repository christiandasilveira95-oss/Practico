version: '3.8'

services:

  # Servidor Web + PHP (front + api)
  app:
    build: .
    container_name: ${APP_NAME}_app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    # Al arrancar, deja escribible la carpeta donde el dashboard guarda las portadas
    # (así no hace falta ningún chmod a mano en Linux) y después inicia Apache.
    command: ["sh", "-c", "mkdir -p /var/www/html/front/uploads/portadas && chmod -R 777 /var/www/html/front/uploads; exec apache2-foreground"]
    depends_on:
      - db

  # Base de Datos MySQL
  db:
    image: mysql:8.0
    container_name: ${APP_NAME}_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: lofi_library
      MYSQL_USER: usuario
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./api/config/init.sql:/docker-entrypoint-initdb.d/init.sql

  # Interfaz gráfica para MySQL
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ${APP_NAME}_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data: